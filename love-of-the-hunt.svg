<svg width="900" height="180" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="loop">

      <stop offset="0%">
        <animate
          attributeName="stop-color"
          values="#4e3d8d;#77d6df;#e7efe1;#4e3d8d"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%">
        <animate
          attributeName="stop-color"
          values="#77d6df;#e7efe1;#4e3d8d;#77d6df"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%">
        <animate
          attributeName="stop-color"
          values="#e7efe1;#4e3d8d;#77d6df;#e7efe1"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>

  </defs>

  <text
    x="450"
    y="90"
    fill="url(#loop)"
    font-size="72"
    font-family="Georgia"
    font-weight="bold"
    text-anchor="middle"
    dominant-baseline="middle">

    Love of the Hunt

  </text>

</svg>
